name: Diagnose Diário Portals

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Run portal diagnostic
        run: python diag.py
      - name: Run HTML viewer diagnostic
        run: python viewdiag.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-diagnostic
          path: |
            diagnostic/
            viewdiag/
          if-no-files-found: warn
