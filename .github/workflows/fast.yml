name: Fast AM BA samples

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  sample:
    if: contains(github.event.issue.title || '', 'Fast AM BA samples') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf
      - name: Run sampler
        run: python sample_fast.py
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-am-ba-samples
          path: fast_samples/
          if-no-files-found: warn
