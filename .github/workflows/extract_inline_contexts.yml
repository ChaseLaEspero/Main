name: Extract inline endpoint contexts

on:
  push:
    branches: [main]
    paths:
      - extract_inline_contexts.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python extract_inline_contexts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remaining_portals_diag/*inline_contexts.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Store inline endpoint contexts"
            git pull --rebase
            git push
          fi
