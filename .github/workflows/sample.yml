name: Download AM BA HTML samples

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  sample:
    if: contains(github.event.issue.title || '', 'Download AM BA samples') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pymupdf
      - name: Download and assess samples
        run: python sample_scrape.py
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-ba-html-txt-samples
          path: samples/
          if-no-files-found: warn
