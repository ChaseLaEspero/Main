name: Quick AutoPage coverage probe

on:
  push:
    branches: [main]
    paths:
      - quick_autopage_probe.py
      - .github/workflows/quick_autopage_probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python quick_autopage_probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick_autopage_results/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Store quick AutoPage probe results"
            git pull --rebase
            git push
          fi
