name: Probe DF and SC exact sources

on:
  push:
    branches: [main]
    paths:
      - probe_df_sc_exact.py
      - .github/workflows/probe_df_sc_exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - run: python probe_df_sc_exact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add df_sc_exact_results/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Store exact DF and SC source probe results"
            git pull --rebase
            git push
          fi
