name: Resolve PI and RO archive boundaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - resolve_pi_ro.py
      - .github/workflows/resolve_pi_ro.yml
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  resolve:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'Resolve PI RO')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Resolve exact archive boundaries
        run: python resolve_pi_ro.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_review_results/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Store PI and RO exact archive results"
            git pull --rebase
            git push
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-ro-manual-review-results
          path: manual_review_results/
          if-no-files-found: warn
