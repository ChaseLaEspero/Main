name: Probe custom Diário portals

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python probe_custom_portals.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_portal_probe/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Store custom portal probe"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-portal-probe
          path: custom_portal_probe/
          if-no-files-found: warn
