name: Remaining state portal diagnostics

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Run diagnostics
        run: python remaining_portals_diag.py
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remaining_portals_diag/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Store remaining state portal diagnostics"
            git push
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-state-portals
          path: remaining_portals_diag/
          if-no-files-found: warn
