name: Summarize remaining portal diagnostics CSV

on:
  push:
    branches: [main]
    paths:
      - summarize_remaining_csv.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python summarize_remaining_csv.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remaining_portals_diag/compact.csv
          if ! git diff --cached --quiet; then
            git commit -m "Store CSV remaining portal diagnostics"
            git push
          fi
