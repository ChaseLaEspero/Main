name: Extract PE search schema

on:
  push:
    branches: [main]
    paths:
      - extract_pe_search_schema.py
      - .github/workflows/extract_pe_search_schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python extract_pe_search_schema.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_portal_probe/PE_search_schema_contexts.*
          if ! git diff --cached --quiet; then
            git commit -m "Store PE search schema contexts"
            git pull --rebase
            git push
          fi
